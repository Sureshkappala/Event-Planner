<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | Haute Concierge Membership | Stackly Luxury Event Planner</title>
  <meta name="description" content="Register for an Stackly account to book and manage luxury galas.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <!-- Top Floating Return to Home Button -->
    <a href="index.html" class="auth-return-home-btn" aria-label="Return to Home">
      <i class="fa-solid fa-arrow-left"></i> Return to Home
    </a>

    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" aria-label="Stackly Home">
          <img src="assets/images/logo.png" alt="Stackly" class="logo-img">
        </a>
        <h2>Create Membership</h2>
        <p>Begin your journey towards extraordinary celebrations.</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Julian Montgomery" pattern="[A-Za-z\s]+" title="Letters and spaces only" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="julian@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number (10 Digits) <span class="required">*</span></label>
          <input type="tel" id="reg-phone" maxlength="10" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" inputmode="numeric" title="10-digit number" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-role">Account Type</label>
          <select id="reg-role" class="form-control">
            <option value="User">Client / Host Account</option>
            <option value="Admin">Concierge / Vendor Associate</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <div class="input-with-icon">
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="input-icon-btn toggle-password-btn" data-target="reg-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="margin-bottom:1.5rem; font-size:0.85rem;">
          <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" id="reg-terms" required> I agree to the <a href="404.html" style="color:var(--burgundy); font-weight:600;">Terms & Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:1.5rem;">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>

        <div style="text-align:center; font-size:0.875rem; color:var(--text-muted);">
          Already have an account? <a href="login.html" style="color:var(--burgundy); font-weight:700;">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/script.js"></script>
</body>
</html>
